name = "webadb-online"
compatibility-date = "2024-11-01"
pages_build_output_dir = "./out"

# To deploy:
#   1. npm run build          (produces ./out)
#   2. npx wrangler pages deploy ./out --project-name webadb-online
#
# First-time setup:
#   npx wrangler login
#   npx wrangler pages project create webadb-online --production-branch main
#
# Custom domain:
#   In the Cloudflare dashboard, add webadb.online as a custom domain
#   to this Pages project. DNS records are managed automatically once
#   the domain is on Cloudflare.
#
# Or use the Cloudflare dashboard's "Direct Upload" integration with
# GitHub: every push to main will rebuild and deploy automatically.