<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#1a2236"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea1ff"/>
      <stop offset="100%" stop-color="#a06bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4ea1ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4ea1ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4ea1ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="900" cy="315" r="400" fill="url(#glow)"/>

  <!-- Top: Logo + wordmark -->
  <g transform="translate(80 80)">
    <rect width="72" height="72" rx="16" fill="url(#accent)"/>
    <g transform="translate(36 42)" fill="#0b0f17">
      <line x1="-15" y1="-22" x2="-21" y2="-30" stroke="#0b0f17" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="-22" x2="21" y2="-30" stroke="#0b0f17" stroke-width="3" stroke-linecap="round"/>
      <path d="M -22 -12 A 22 18 0 0 1 22 -12 L 22 -4 L -22 -4 Z"/>
      <rect x="-22" y="-2" width="44" height="12" rx="3"/>
    </g>
  </g>
  <text x="180" y="135"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="44" font-weight="700" fill="#e6ebf5">WebADB</text>

  <!-- Headline (vertically centered group) -->
  <g transform="translate(80 290)">
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="86" font-weight="800" fill="#ffffff">Run ADB fully</text>
    <text x="0" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
          font-size="86" font-weight="800" fill="#a06bff">in your browser.</text>
  </g>

  <!-- Subhead: features -->
  <text x="80" y="495"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-weight="400" fill="#98a3b8">Shell · Install APK · Files · Logcat · Apps · Wi-Fi ADB</text>

  <!-- Domain bottom -->
  <g transform="translate(80 545)">
    <rect width="290" height="46" rx="8" fill="#111726" stroke="#243049" stroke-width="1"/>
    <text x="145" y="31"
          font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace"
          font-size="24" font-weight="500" fill="#4ea1ff"
          text-anchor="middle">webadb.online</text>
  </g>
</svg>